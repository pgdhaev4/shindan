  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {

    .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 34px; }
    /* 補足の小さい文字は --muted(#8a988f) だと背景とのコントラストが2.74:1しかなく、
       WCAG AAの4.5:1に届かない（2026-09-07 照査指摘・実測）。--ink-soft(#5f7268)=4.66:1 を使う。 */

  <script src="/shindan/kokoro_app/measure.js"></script>
  <script>
    // 流入元（f）は「今回のURL」→「同じタブで覚えている値」の順で拾う。
    // ★f を各リンクに直書きしてはいけない（Xから来た人まで yt になるため）。
    (function () {
      var f = '', vFromUrl = '';
      try {
        var p = new URLSearchParams(location.search);
        f = p.get('f') || '';
        vFromUrl = p.get('v') || '';          // ★URLに付いていた値だけを前置きに使う
        if (!f) {
          var s = JSON.parse(sessionStorage.getItem('kmes_src') || 'null') || {};
          f = s.f || '';
          // ★保存値(vid)は前置きに使わない。再訪のたびに選択肢名が二重に連結され、
          //   「abcdefghijk--st_work」「st_kosodate-st_work」のような値になるため（2026-09-07 照査指摘・再現済み）。
        }
      } catch (e) { /* 何もしない */ }
      if (!f) return;                          // 流入元不明のときはURLを変えない

      // 前置き＝流入の識別子（将来 動画ID等が付いたとき用）。選択肢名と混ざらないよう「_」を除く
      var base = String(vFromUrl).replace(/[^A-Za-z0-9-]/g, '').slice(0, 12);
      var tags = document.querySelectorAll('a[data-v]');
      for (var i = 0; i < tags.length; i++) {
        (function (a) {
          var choice = a.getAttribute('data-v');
          var vid = ((base ? base + '-' : '') + choice).slice(0, 32);
          var href = a.getAttribute('href');
          var hash = '';
          var h = href.indexOf('#');
          if (h >= 0) { hash = href.slice(h); href = href.slice(0, h); }
          var join = href.indexOf('?') >= 0 ? '&' : '?';
          a.setAttribute('href', href + join + 'f=' + encodeURIComponent(f) + '&v=' + encodeURIComponent(vid) + hash);

          // 入口ページの「どのボタンが押されたか」はGA4で数える（自前計測APIは改修しない）
          a.addEventListener('click', function () {
            try {
              if (typeof gtag === 'function') {
                gtag('event', 'entry_choice', { choice: choice, source: f });
              }
            } catch (e) { /* 計測の失敗は導線に影響させない */ }
          });
        })(tags[i]);
      }
      try {
        if (typeof gtag === 'function') gtag('event', 'entry_view', { source: f });
      } catch (e) { /* 何もしない */ }
    })();
  </script>
